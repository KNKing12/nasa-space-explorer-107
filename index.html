<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <!-- Thinking Cloud with Space Facts and Jokes -->
  <div class="thinking-cloud">
    <div class="cloud-shape">
      <div class="cloud-content">
        <p id="fact-text">Loading cosmic wisdom...</p>
        <span class="refresh-icon">✨</span>
      </div>
    </div>
  </div>

  <div class="theme-toggle-container">
    <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" id="themeToggle" />
    <div class="theme-label">Day/Night Mode</div>
  </div>

  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="header-logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button>Explore the Galaxies</button>
    </div>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <img src="img/undraw_counting-stars_1fur.svg" alt="Counting Stars" class="placeholder-icon" />
        <p>Select a date range and click "Explore the Galaxies" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <!-- Modal for displaying full image details -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <button class="modal-close">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/dateRange.js"></script>
  <script src="js/factsAndJokes.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
